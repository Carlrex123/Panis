<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Booking at Su-ssheesh Restaurant</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <div class="container">
        <img class="sushi-img" src="Logo.png" alt="Sushi Image" width="300"> 
        <h2>Sushi Table Booking</h2>
        <form action="thankyou.html" method="post" target="landing.html"> <!-- Select the file after clicking submit -->
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="date-time">Preferred Date and Time:</label>
            <input type="datetime-local" id="date-time" name="date-time" required>
            <label for="table-number">Select Table Number:</label>
            <input type="age" id="age" name="table-number" required> <br>
            <label for="payment-method">Payment Method:</label>
            <select id="payment-method" name="payment-method" required>
                <option value="" disabled selected>Select Payment Method</option>
                <option value="visa">Visa</option>
                <option value="bpi">BPI</option>
                <option value="bdo">BDO</option>
                <option value="gcash">GCash</option>
                <option value="paymaya">PayMaya</option>
                <option value="paypal">PayPal</option>
            </select>
            
            <input type="submit" value="Book Now">
        </form>
    </div>
</body>
</html>
