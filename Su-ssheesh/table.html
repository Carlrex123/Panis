<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Restaurant Floor Plan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Sushi Restaurant Floor Plan</h1>
    <div class="floor-plan">
        <div class="table" id="table1">Table 1</div>
        <div class="table" id="table2">Table 2</div>
        <div class="table" id="table3">Table 3</div>
        <div class="table" id="table4">Table 4</div>
        <div class="table" id="table5">Table 5</div>
        <div class="table" id="table6">Table 6</div>
        <div class="table" id="table7">Table 7</div>
        <div class="table" id="table8">Table 8</div>
        <div class="table" id="table9">Table 9</div>
        <div class="table" id="table10">Table 10</div>
    </div>
    <div class="status">
        <label for="table-number">Enter table number:</label>
        <input type="number" id="table-number" min="1" max="10">
        <button onclick="occupyTable()">Occupy Table</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
