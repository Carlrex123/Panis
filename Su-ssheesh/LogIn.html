<!DOCTYPE html>
<html>
<head>
   <title>Log in</title>
   <style>
       body {
           font-family: Arial, sans-serif;
           background-image: url('background.jpg'); /* Add your background image URL here */
           background-size: cover;
           background-repeat: no-repeat;
           background-position: center;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           margin: 0;
       }
       form {
           background-color: #fff;
           padding: 20px;
           border-radius: 8px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
           max-width: 300px;
           width: 100%;
           /* Add a fixed width for desktop */
           width: 80%; /* Adjust the width as needed */
           max-width: 400px; /* Set a maximum width if needed */
       }
       input, textarea {
           width: calc(100% - 22px);
           padding: 10px;
           margin: 5px 0;
           border: 1px solid #ccc;
           border-radius: 4px;
           box-sizing: border-box;
       }
       input[type="submit"],
       input[type="button"] {
           width: 100%;
           background-color: #4CAF50;
           color: white;
           padding: 10px 0;
           margin: 8px 0;
           border: none;
           border-radius: 4px;
           cursor: pointer;
           font-size: 16px;
           transition: background-color 0.3s ease;
       }
       input[type="submit"]:hover,
       input[type="button"]:hover {
           background-color: #45a049;
       }
       h1 {
           text-align: center;
           margin-bottom: 20px;
       }
       p {
           margin: 10px 0;
           font-weight: bold;
           text-align: center;
       }
       a {
           text-decoration: none;
           color: #4CAF50;
           font-weight: bold;
           transition: color 0.3s ease;
       }
       a:hover {
           color: #45a049;
       }
   </style>
</head>
<body>
    <form action="landing.html">
        <h1>Log In</h1>
        <input type="email" placeholder="Email address" required> <br>
        <input type="text" placeholder="Password" required> <br> 
        <input type="submit" value="Log In"> <br> <!-- Changed from input type="button" -->
        <p>Don't have an account? <a href="Signup.html">Sign Up</a></p>
    </form>
</body>
</html>
